# =============================================================================
#  runway-demo plugin i18n bundle (English).
#
#  The Runway kernel appends this bundle to the operator console's MessageSource AND to every site's public
#  MessageSource (add-only: a plugin may add keys but never override a core or site key). Console text is read
#  with #{...} in the console templates and Messages.console(...) in Java; visitor-facing text with
#  Messages.site(siteId, locale, ...). A message that takes arguments ({0}) is a java.text.MessageFormat pattern:
#  write a literal apostrophe as ''. Keys live WITH the plugin, never in core. Keep messages_es.properties in step
#  (a test checks both define the same keys).
# =============================================================================

