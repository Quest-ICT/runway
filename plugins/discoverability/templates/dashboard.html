<!-- Tenant dashboard card fragment — resolved as __plugin__/discoverability/dashboard. Bare fragment
     (no <html>/<body>); all binding lives in the paired dashboard.th.xml. -->
<div class="card">
    <div class="card-status-start bg-primary"></div>
    <div class="card-body">
        <div class="d-flex align-items-center">
            <span class="bg-primary-lt avatar"><i class="fa-solid fa-magnifying-glass-chart"></i></span>
            <div class="ms-3">
                <div class="fw-bold" id="dc-title">Discoverability</div>
                <div class="text-secondary small">
                    <span id="dc-pages">0</span> <span id="dc-pages-lbl">pages</span>
                    · JSON-LD <span id="dc-jsonld">on</span>
                    · GEO <span id="dc-geo">off</span>
                </div>
            </div>
        </div>
    </div>
</div>
