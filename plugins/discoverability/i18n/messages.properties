# Shared
discover.on=on
discover.off=off

# Advisory quality-check finding (resolved by the host as quality.<finding-code> in the operator UI locale)
quality.discoverability.faq.unmarked=This page has an on-page FAQ (a <details>/<summary> block) that isn't emitting FAQPage structured data — declare it in the discoverability plugin's content.schema for this path.

# Page editor: what the page is described as (PageTypeCheck, 2.2.0)
discover.pagetype.off=Structured data is switched off for this site, so this page is not described to search engines.
discover.pagetype.default=Structured data: this page is a {0}, the site''s Default page type.
discover.pagetype.schema=Structured data: this page is a {0}, set by Per-page types (pattern {1}).
discover.pagetype.added=Per-page types also add: {0}.
discover.pagetype.unknown=Per-page types name {0} for this page, which this plugin does not know; it is ignored.
discover.pagetype.extra=Per-page types give this page more than one page type; only the first ({0}) applies, {1} is ignored.
discover.pagetype.noindex=Structured data: this page is excluded from search engines (noindex), so it carries no structured data.
discover.pagetype.otherLanguage=Per-page types: {0} describes the default language''s page, not this one; a page in another language is matched only by its own path. To describe this page, add {1}.
# A block that applies but publishes nothing of its own ({0} = its type); shown in the editor and, after the pattern, in the check below the form
discover.gap.faq={0} has no question with both q: and a:, so the page is an {0} with no questions.
discover.gap.items={0} has no item with a url:, so no list is published.

# Admin fragment: Per-page types check (2.2.0)
discover.schema.title=Per-page types check
discover.schema.ok=No problems found.
discover.schema.syntax=Per-page types cannot be read, so no page gets a per-page type: {0}
discover.schema.notBlock={0}: the value must be a type block (type: ...) or a list of them; ignored.
discover.schema.slash={0}: a pattern starts with / and matches page paths.
discover.schema.star={0}: * works only at the end of a pattern; here it is matched as a character.
discover.schema.unknown={0}: {1} is not a type this plugin knows; ignored.
discover.schema.twoPageTypes={0}: more than one page type; only the first applies.
