discover.set.jsonldType=Default page type
discover.set.breadcrumbs=Breadcrumb trail
discover.set.contentSchema=Per-page types (content.schema)
discover.set.orgName=Organization name
discover.set.orgLogo=Organization logo
discover.set.orgSameAs=Official profiles
discover.set.softwareEnabled=Describe a product on the homepage
discover.set.softwareName=Product name
discover.set.softwareDescription=Description
discover.set.softwareCategory=Category
discover.set.softwareOs=Operating systems
discover.set.softwarePrice=Price
discover.set.softwareCurrency=Currency
discover.set.softwareLicense=License URL
discover.set.softwareUrl=Product URL
discover.set.softwareScreenshot=Screenshot URL
discover.set.sitemapEnabled=Sitemap (/sitemap.xml)
discover.set.robotsAiDefault=Default AI-crawler policy
discover.set.robotsAiAgentsExtra=Additional AI crawler names
discover.set.robotsAiPolicy=AI crawlers on this site
discover.set.robotsAiTraining=AI training crawlers
discover.set.robotsAiRetrieval=AI answer-engine crawlers
discover.set.robotsAiUser=AI fetches a person asked for
discover.set.robotsExtraDisallow=Paths crawlers should skip
discover.set.robotsCustom=Custom robots.txt
discover.set.geoEnabled=AI answer-engine optimization (GEO)
discover.set.geoSummary=Site summary
discover.set.geoSpeakable=Speakable parts of a page
discover.set.searchUrl=Site search URL
discover.set.indexnowEnabled=Notify search engines of changes
discover.set.indexnowKey=IndexNow key
discover.set.indexnowAppEnabled=Allow sites to use IndexNow
discover.set.indexnowEndpoint=Submission endpoint
discover.set.indexnowBatch=Seconds to gather changes
discover.set.indexnowMaxUrls=Maximum URLs per submission
discover.set.indexnowMaxQueued=Maximum URLs queued per site
discover.set.indexnowTimeout=Submission timeout (seconds)

# Settings form: help lines (one short line, always visible under the field)
discover.help.jsonldEnabled=Adds schema.org structured data to every page so search engines understand what it is. Leave it on: everything else in this section needs it.
discover.help.jsonldType=Article for blogs and news sites, WebPage for everything else. Every page is described as this type unless Advanced → Per-page types gives it its own: a page type there (Article, AboutPage, ContactPage, FAQPage, CollectionPage, …) replaces this one on the pages it matches, and any other type (a product, a service, a local business) is added to the page. The page editor shows each page's type and where it comes from.
discover.help.breadcrumbs=Adds a Home \u203a Page trail to search results. A middle level appears where content.schema declares one (breadcrumb: {name, url}).
discover.help.orgName=Who publishes this site. Leave blank to publish no organization.
discover.help.orgLogo=A square image: a full URL, or a path on this site such as /img/logo.png.
discover.help.orgSameAs=Your official profiles (LinkedIn, GitHub, …). Links this site to them.
discover.help.contentSchema=Declares page types (FAQ, product, service, local business…) per URL path, in YAML. See the examples in the help.
discover.help.sitemapEnabled=Serves /sitemap.xml and announces it in robots.txt. Leave it on.
discover.help.robotsExtraDisallow=Paths every crawler should skip, for example /drafts/.
discover.help.robotsCustom=Replaces the ENTIRE generated robots.txt, including the sitemap line and the AI rules. Use it only if you know you need it.
discover.help.robotsAiPolicy=Allow or refuse AI crawlers. inherit follows the platform's default.
discover.help.robotsAiTraining=Crawlers that collect text to train AI models. Refusing them costs this site nothing visible.
discover.help.robotsAiRetrieval=Crawlers behind AI answers (ChatGPT search, Perplexity…). Refusing them removes this site from those answers.
discover.help.robotsAiUser=A visit a person asked an AI assistant to make. Refusing it breaks that visit.
discover.help.robotsAiDefault=What a site set to inherit gets. allow keeps sites visible to AI answer engines.
discover.help.robotsAiAgentsExtra=AI crawler names the plugin does not know yet, one per line. Write training=Name, retrieval=Name or user=Name to put one in a class; without it, a name follows each site's overall AI policy.
discover.help.geoEnabled=Publishes /llms.txt and marks up pages for AI assistants. The search URL and speakable parts also need structured data on.
discover.help.geoSummary=A plain-language paragraph about the site, placed at the top of /llms.txt.
discover.help.geoSpeakable=CSS selectors for the parts of a page worth reading aloud or quoting. The default suits most sites.
discover.help.searchUrl=Your search-results page, e.g. /search?q={query}. Without {query}, ?q= is added. Published as a schema.org SearchAction; Google no longer shows a search box from it.
discover.help.softwareEnabled=Describes your product as a SoftwareApplication, on the homepage only. Needs structured data on.
discover.help.softwareName=Blank uses the organization name, or else the site name.
discover.help.softwareDescription=Blank uses the homepage's description.
discover.help.softwareCategory=A schema.org category, e.g. WebApplication, BusinessApplication, DeveloperApplication.
discover.help.softwareOs=Where it runs, e.g. Web, or Windows, macOS, Linux.
discover.help.softwarePrice=A number; 0 means free. Blank publishes no price.
discover.help.softwareCurrency=A three-letter currency code, e.g. USD, MXN, EUR.
discover.help.softwareLicense=A link to the product's license.
discover.help.softwareUrl=Blank uses the homepage.
discover.help.softwareScreenshot=A full URL to an image of the product.
discover.help.indexnowEnabled=Sends changed page addresses to the engines that use IndexNow. Google does not.
discover.help.indexnowKey=A random string of 8 to 128 letters, digits or dashes (IndexNow's rule). Published at /indexnow-key.txt to prove the site is yours.
discover.help.indexnowAppEnabled=Lets each site turn IndexNow on for itself. When on, this server makes outbound requests to the IndexNow endpoint.
discover.help.indexnowEndpoint=Where submissions go. The shared endpoint forwards to every participating engine.
discover.help.indexnowBatch=Changes are gathered for this long and sent together.
discover.help.indexnowMaxUrls=URLs beyond this in one submission are not sent (a warning is logged); those pages are still crawled the ordinary way.
discover.help.indexnowMaxQueued=Once a site has this many changes waiting, further ones are not queued until the next submission (a warning is logged).
discover.help.indexnowTimeout=How long to wait for the endpoint before giving up on a submission.

