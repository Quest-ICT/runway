discover.card.title=Discoverability
discover.card.pages=Pages

# Admin status fragment
discover.admin.title=Discoverability status
discover.admin.jsonld=Structured data
discover.admin.sitemap=Sitemap
discover.admin.geo=GEO · llms.txt
discover.admin.pages=Pages in sitemap
discover.admin.note=These surfaces enrich the head/response layer; the kernel already emits canonical, hreflang and robots.
