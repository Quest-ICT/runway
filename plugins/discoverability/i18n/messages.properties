# Discoverability plugin — English. Appended add-only to the console + per-site MessageSource; keys are the
# plugin's own (discover.*) and never override core.

# Control-point permission (permissions matrix + gates)
discover.perm.settings=Manage discoverability (SEO & GEO)

# Settings form: sections (heading + one-line introduction)
discover.grp.structured=Structured data for search engines
discover.grp.structured.help=Tells search engines what each page is and who publishes the site. On by default; most sites only need to fill in the organization.
discover.grp.sitemap=Sitemap and robots.txt
discover.grp.sitemap.help=The list of pages offered to crawlers, and the rules for what they may fetch.
discover.grp.ai=AI crawlers
discover.grp.ai.help=Whether AI companies' crawlers may read the site. Ordinary search engines are not affected.
discover.grp.geo=AI answer engines (GEO)
discover.grp.geo.help=Optional extras that help AI assistants understand and quote this site. Off by default.
discover.grp.software=Product on the homepage
discover.grp.software.help=For sites that present a software product or app. Off by default.
discover.grp.indexnow=Notify search engines of changes (IndexNow)
discover.grp.indexnow.help=Tells Bing, Yandex, Seznam, Naver and Yep when pages change. Google does not use IndexNow.

