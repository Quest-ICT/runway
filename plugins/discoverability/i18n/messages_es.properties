# Hallazgo de la verificación de calidad (el host lo resuelve como quality.<código> en el idioma del operador)
quality.discoverability.faq.unmarked=Esta página tiene un FAQ en la propia página (un bloque <details>/<summary>) que no emite datos estructurados FAQPage — decláralo en el content.schema del complemento de descubribilidad para esta ruta.

# Editor de páginas: cómo se describe la página (PageTypeCheck, 2.2.0)
discover.pagetype.off=Los datos estructurados están desactivados en este sitio, así que esta página no se describe a los buscadores.
discover.pagetype.default=Datos estructurados: esta página es un {0}, el tipo de página predeterminado del sitio.
discover.pagetype.schema=Datos estructurados: esta página es un {0}, fijado en Tipos por página (patrón {1}).
discover.pagetype.added=Tipos por página también añade: {0}.
discover.pagetype.unknown=Tipos por página nombra {0} para esta página, un tipo que este complemento no conoce; se ignora.
discover.pagetype.extra=Tipos por página da a esta página más de un tipo de página; solo se aplica el primero ({0}), {1} se ignora.
discover.pagetype.noindex=Datos estructurados: esta página está excluida de los buscadores (noindex), así que no lleva datos estructurados.
discover.pagetype.otherLanguage=Tipos por página: {0} describe la página del idioma predeterminado, no esta; una página en otro idioma solo coincide con su propia ruta. Para describir esta página, añade {1}.
# Un bloque que se aplica pero no publica nada propio ({0} = su tipo); se muestra en el editor y, tras el patrón, en la revisión bajo el formulario
discover.gap.faq={0} no tiene ninguna pregunta con q: y a:, así que la página es un {0} sin preguntas.
discover.gap.items={0} no tiene ningún elemento con url:, así que no se publica ninguna lista.

# Fragmento de administración: revisión de Tipos por página (2.2.0)
discover.schema.title=Revisión de Tipos por página
discover.schema.ok=No se encontraron problemas.
discover.schema.syntax=No se puede leer Tipos por página, así que ninguna página recibe un tipo por página: {0}
discover.schema.notBlock={0}: el valor debe ser un bloque de tipo (type: ...) o una lista de ellos; se ignora.
discover.schema.slash={0}: un patrón empieza con / y se compara con las rutas de las páginas.
discover.schema.star={0}: * solo funciona al final de un patrón; aquí se toma como un carácter.
discover.schema.unknown={0}: {1} no es un tipo que este complemento conozca; se ignora.
discover.schema.twoPageTypes={0}: más de un tipo de página; solo se aplica el primero.
