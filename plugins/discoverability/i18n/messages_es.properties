# Formulario de configuración: líneas de ayuda (una línea corta, siempre visible bajo el campo)
discover.help.jsonldEnabled=Añade datos estructurados de schema.org a cada página para que los buscadores entiendan qué es. Déjalo activado: todo lo demás de esta sección lo necesita.
discover.help.jsonldType=Article para blogs y sitios de noticias, WebPage para todo lo demás. Toda página se describe con este tipo, salvo que Avanzado → Tipos por página le dé uno propio: un tipo de página ahí (Article, AboutPage, ContactPage, FAQPage, CollectionPage, …) sustituye a este en las páginas que coinciden, y cualquier otro tipo (un producto, un servicio, un negocio local) se añade a la página. El editor de páginas muestra el tipo de cada página y de dónde viene.
discover.help.breadcrumbs=Añade a los resultados de búsqueda una ruta Inicio \u203a Página. Aparece un nivel intermedio donde content.schema lo declara (breadcrumb: {name, url}).
discover.help.orgName=Quién publica este sitio. Déjalo en blanco para no publicar ninguna organización.
discover.help.orgLogo=Una imagen cuadrada: una URL completa o una ruta de este sitio, como /img/logo.png.
discover.help.orgSameAs=Tus perfiles oficiales (LinkedIn, GitHub, …). Vincula este sitio con ellos.
discover.help.contentSchema=Declara tipos de página (FAQ, producto, servicio, negocio local…) por ruta, en YAML. Consulta los ejemplos en la ayuda.
discover.help.sitemapEnabled=Sirve /sitemap.xml y lo anuncia en robots.txt. Déjalo activado.
discover.help.robotsExtraDisallow=Rutas que todos los rastreadores deben omitir, por ejemplo /borradores/.
discover.help.robotsCustom=Reemplaza TODO el robots.txt generado, incluida la línea del mapa del sitio y las reglas de IA. Úsalo solo si sabes que lo necesitas.
discover.help.robotsAiPolicy=Permite (allow) o rechaza (disallow) los rastreadores de IA. «inherit» sigue el valor predeterminado de la plataforma.
discover.help.robotsAiTraining=Rastreadores que recopilan texto para entrenar modelos de IA. Rechazarlos no le cuesta nada visible a este sitio.
discover.help.robotsAiRetrieval=Rastreadores detrás de las respuestas de IA (búsqueda de ChatGPT, Perplexity…). Rechazarlos saca a este sitio de esas respuestas.
discover.help.robotsAiUser=Una visita que una persona pidió a un asistente de IA. Rechazarla rompe esa visita.
discover.help.robotsAiDefault=Lo que recibe un sitio configurado en «inherit». «allow» mantiene los sitios visibles para los motores de respuesta.
discover.help.robotsAiAgentsExtra=Nombres de rastreadores de IA que el complemento aún no conoce, uno por línea. Escribe training=Nombre, retrieval=Nombre o user=Nombre para asignarle una clase; sin ello, el nombre sigue la política general de IA de cada sitio.
discover.help.geoEnabled=Publica /llms.txt y marca las páginas para asistentes de IA. La URL de búsqueda y las partes «speakable» también necesitan los datos estructurados activados.
discover.help.geoSummary=Un párrafo en lenguaje sencillo sobre el sitio, al principio de /llms.txt.
discover.help.geoSpeakable=Selectores CSS de las partes de una página que vale la pena leer en voz alta o citar. El valor predeterminado sirve para la mayoría de los sitios.
discover.help.searchUrl=Tu página de resultados de búsqueda, p. ej. /buscar?q={query}. Sin {query} se añade ?q=. Se publica como SearchAction de schema.org; Google ya no muestra un cuadro de búsqueda a partir de él.
discover.help.softwareEnabled=Describe tu producto como SoftwareApplication, solo en la página de inicio. Necesita los datos estructurados activados.
discover.help.softwareName=En blanco usa el nombre de la organización o, si no hay, el del sitio.
discover.help.softwareDescription=En blanco usa la descripción de la página de inicio.
discover.help.softwareCategory=Una categoría de schema.org, p. ej. WebApplication, BusinessApplication, DeveloperApplication.
discover.help.softwareOs=Dónde funciona, p. ej. Web, o Windows, macOS, Linux.
discover.help.softwarePrice=Un número; 0 significa gratis. En blanco no publica precio.
discover.help.softwareCurrency=Un código de moneda de tres letras, p. ej. USD, MXN, EUR.
discover.help.softwareLicense=Un enlace a la licencia del producto.
discover.help.softwareUrl=En blanco usa la página de inicio.
discover.help.softwareScreenshot=Una URL completa a una imagen del producto.
discover.help.indexnowEnabled=Envía las direcciones de las páginas que cambian a los buscadores que usan IndexNow. Google no lo usa.
discover.help.indexnowKey=Una cadena aleatoria de 8 a 128 letras, dígitos o guiones (la regla de IndexNow). Se publica en /indexnow-key.txt para demostrar que el sitio es tuyo.
discover.help.indexnowAppEnabled=Permite que cada sitio active IndexNow por su cuenta. Activado, este servidor hace peticiones salientes al punto de envío de IndexNow.
discover.help.indexnowEndpoint=A dónde van los envíos. El punto compartido reenvía a todos los buscadores participantes.
discover.help.indexnowBatch=Los cambios se agrupan durante este tiempo y se envían juntos.
discover.help.indexnowMaxUrls=Las URLs que excedan este límite en un envío no se envían (se registra una advertencia); esas páginas se siguen rastreando de la forma habitual.
discover.help.indexnowMaxQueued=Cuando un sitio tiene esta cantidad de cambios en espera, los siguientes no se encolan hasta el próximo envío (se registra una advertencia).
discover.help.indexnowTimeout=Cuánto esperar al punto de envío antes de abandonar un envío.

