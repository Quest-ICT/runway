# Discoverability plugin — Español. Añadido de forma aditiva al MessageSource de consola + por-sitio.

# Permiso de punto de control
discover.perm.settings=Gestionar visibilidad (SEO y GEO)

# Formulario de configuración: secciones (título + una línea de introducción)
discover.grp.structured=Datos estructurados para buscadores
discover.grp.structured.help=Indica a los buscadores qué es cada página y quién publica el sitio. Activado por defecto; a la mayoría de los sitios solo les falta completar la organización.
discover.grp.sitemap=Mapa del sitio y robots.txt
discover.grp.sitemap.help=La lista de páginas que se ofrece a los rastreadores y las reglas de lo que pueden descargar.
discover.grp.ai=Rastreadores de IA
discover.grp.ai.help=Si los rastreadores de las empresas de IA pueden leer el sitio. No afecta a los buscadores normales.
discover.grp.geo=Motores de respuesta de IA (GEO)
discover.grp.geo.help=Extras opcionales que ayudan a los asistentes de IA a entender y citar este sitio. Desactivado por defecto.
discover.grp.software=Producto en la página de inicio
discover.grp.software.help=Para sitios que presentan un producto de software o una aplicación. Desactivado por defecto.
discover.grp.indexnow=Avisar a los buscadores de los cambios (IndexNow)
discover.grp.indexnow.help=Avisa a Bing, Yandex, Seznam, Naver y Yep cuando cambian las páginas. Google no usa IndexNow.

