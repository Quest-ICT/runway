# Runway Database — MariaDB provider — español
database-mariadb.group.connection=Servidor
database-mariadb.group.connection.help=El servidor MariaDB donde Runway guarda los datos de los plugins. Los cambios se aplican al reiniciar; pruébelos antes con las pruebas de conexión de la página de ajustes del plugin Base de datos. En un clúster, todos los nodos necesitan los mismos valores.
database-mariadb.set.host=Servidor
database-mariadb.set.host.help=Un nombre de host o una dirección IP. Un solo servidor.
database-mariadb.set.port=Puerto
database-mariadb.set.port.help=Déjelo en blanco para usar el predeterminado de MariaDB, 3306.
database-mariadb.set.database=Base de datos
database-mariadb.set.database.help=Una base de datos existente en el servidor. Runway crea sus propias bases de datos junto a ella: una por sitio y una para toda la instalación.
database-mariadb.set.username=Usuario
database-mariadb.set.password=Contraseña
database-mariadb.set.tls=TLS
database-mariadb.set.tls.help=verify-full comprueba el certificado y el nombre del servidor. require cifra sin comprobar quién es el servidor. Use disable solo para una base de datos en el mismo equipo o en una red privada de confianza.
database-mariadb.set.caCertificate=Certificado de la CA (PEM)
database-mariadb.set.caCertificate.help=La autoridad que firmó el certificado del servidor, cuando el almacén de confianza de Java no la conoce.
database-mariadb.set.collation=Intercalación
database-mariadb.set.collation.help=Para las tablas de los plugins. En blanco se usa utf8mb4_uca1400_ai_ci (utf8mb4_unicode_ci antes de MariaDB 10.10).
