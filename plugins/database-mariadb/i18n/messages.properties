# Runway Database — MariaDB provider — English
database-mariadb.group.connection=Server
database-mariadb.group.connection.help=The MariaDB server Runway keeps plugins' data on. Changes apply after a restart; test them first with the connection tests on the Database plugin's settings page. In a cluster every node needs the same values.
database-mariadb.set.host=Host
database-mariadb.set.host.help=A host name or an IP address. One server only.
database-mariadb.set.port=Port
database-mariadb.set.port.help=Leave blank for MariaDB's default, 3306.
database-mariadb.set.database=Database
database-mariadb.set.database.help=An existing database on the server. Runway creates its own databases next to it: one per site and one for the whole installation.
database-mariadb.set.username=Username
database-mariadb.set.password=Password
database-mariadb.set.tls=TLS
database-mariadb.set.tls.help=verify-full checks the server's certificate and name. require encrypts without checking who the server is. Use disable only for a database on the same host or a private network you trust.
database-mariadb.set.caCertificate=CA certificate (PEM)
database-mariadb.set.caCertificate.help=The certificate authority that signed the server's certificate, when the Java trust store does not know it.
database-mariadb.set.collation=Collation
database-mariadb.set.collation.help=For plugins' tables. Blank uses utf8mb4_uca1400_ai_ci (utf8mb4_unicode_ci before MariaDB 10.10).
