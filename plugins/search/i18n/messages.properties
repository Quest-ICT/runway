search.page.card.install=Install search page
search.page.card.install.tip=Seed a ready-made, editable search results page (idempotent — it never overwrites an existing page)
search.page.card.badge=Installed
search.page.card.at=Installed at
search.page.card.edit=— edit it under Pages.

