# Runway Search plugin — English strings. Appended LAST to the operator-console and every per-site message
# source (may ADD keys, never override a core key). Console labels resolve automatically; public-facing strings
# (search.box.*, search.results.*, search.page.title) are resolved with Messages.site for the site and the request
# locale; the operator actions' answers with Messages.console, in the operator's language.

# Grantable permission (permissions matrix label)
search.perm.settings=Configure search

# App-level settings form labels (superadmin; platform concerns)
search.set.refresh=Index freshness (minutes)
search.set.perMinute=Max searches per IP per minute (0 = no limit)
search.set.perHour=Max searches per IP per hour (0 = no limit)

# Per-tenant settings form labels
search.set.enabled=Enable search
search.set.resultLimit=Maximum results
search.set.resultsPath=Results page path
search.set.placeholder=Search box placeholder
search.set.exclude=Excluded content (one page slug or entry id per line)
search.set.snippetLength=Snippet length (characters)
search.set.highlight=Highlight the matches on the page a result opens
search.set.titleWeight=Title match weight
search.set.descriptionWeight=Description match weight
search.set.bodyWeight=Body match weight (per occurrence)
search.set.allTermsBonus=All-terms bonus
search.set.phraseTitleBonus=Title phrase bonus
search.set.phraseBodyBonus=Body phrase bonus
search.set.recordNoResults=Record searches with no results
search.set.noResultsRetention=Keep unrepeated terms for (days)
search.help.recordNoResults=Lists what visitors searched for and did not find, so you can see which content is missing. Off by default: search terms are typed by visitors and can contain personal data. Only the term, how often, and when it was last searched are kept — never an IP address or a user. Terms that look like an email address or a phone number are not kept.
search.help.highlight=A result link carries the words the search matched, and the page it opens highlights them and scrolls to the first one. The words travel after the # of the address, so they never reach the server, and they are removed from the address once the page has read them. Off: plain result links, and the small script that does this is not added to your pages.
search.help.noResultsRetention=A term nobody has searched for in this many days is dropped from the list.

