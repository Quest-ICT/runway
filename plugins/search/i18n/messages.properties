search.noresults.title=Searches with no results
search.noresults.intro=What visitors searched for on this site and did not find — candidates for new pages, better titles or descriptions, or a redirect.
search.noresults.off=Recording is off for this site. Turn on "Record searches with no results" above to start the list.
search.noresults.col.term=Search term
search.noresults.col.count=Searches
search.noresults.col.lastSeen=Last searched
search.noresults.empty=No searches without results recorded yet.
