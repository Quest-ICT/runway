search.noresults.clear=Clear list
search.noresults.clear.tip=Forget every recorded term for this site (it cannot be undone)
search.noresults.clearFailed=Could not clear the list of searches with no results.
search.widget.results=List the results here
search.widget.help.results=What this box shows when its page is opened with a search (?q=). auto: the results, unless the box is in the master template (a header or footer box), so the results page does not list them twice. always: the results, wherever the box is. never: only the box.
