search.noresults.title=Búsquedas sin resultados
search.noresults.intro=Lo que los visitantes buscaron en este sitio y no encontraron — candidatos para nuevas páginas, mejores títulos o descripciones, o una redirección.
search.noresults.off=El registro está desactivado para este sitio. Active "Registrar búsquedas sin resultados" arriba para empezar la lista.
