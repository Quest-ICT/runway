search.noresults.clear=Vaciar lista
search.noresults.clear.tip=Olvidar todos los términos registrados de este sitio (no se puede deshacer)
search.noresults.clearFailed=No se pudo vaciar la lista de búsquedas sin resultados.
search.widget.results=Mostrar aquí los resultados
search.widget.help.results=Lo que muestra este cuadro cuando su página se abre con una búsqueda (?q=). auto: los resultados, salvo que el cuadro esté en la plantilla maestra (un cuadro del encabezado o del pie), para que la página de resultados no los muestre dos veces. always: los resultados, esté donde esté el cuadro. never: solo el cuadro.
