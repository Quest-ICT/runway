search.help.recordNoResults=Muestra lo que los visitantes buscaron y no encontraron, para ver qué contenido falta. Desactivado por omisión: los términos los escriben los visitantes y pueden contener datos personales. Solo se guarda el término, cuántas veces y cuándo se buscó por última vez — nunca una dirección IP ni un usuario. Los términos que parecen un correo electrónico o un número de teléfono no se guardan.
search.help.highlight=El enlace de cada resultado lleva las palabras que encontró la búsqueda, y la página que abre las resalta y se desplaza a la primera. Las palabras van después del # de la dirección, así que nunca llegan al servidor, y se quitan de la dirección en cuanto la página las lee. Desactivado: enlaces simples, y el pequeño script que hace esto no se agrega a tus páginas.
search.help.noResultsRetention=Un término que nadie ha buscado en estos días se quita de la lista.

