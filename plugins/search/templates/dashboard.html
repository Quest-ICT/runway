<!-- Tenant dashboard card fragment — resolved as __plugin__/search/dashboard. Bare fragment
     (no <html>/<body>); all binding lives in the paired dashboard.th.xml. -->
<div class="card">
    <div class="card-status-start bg-azure"></div>
    <div class="card-body">
        <div class="d-flex align-items-center">
            <span class="bg-azure-lt avatar"><i class="fa-solid fa-magnifying-glass"></i></span>
            <div class="ms-3">
                <div class="fw-bold" id="sc-title">Search</div>
                <div class="text-secondary small">
                    <span id="sc-pages">0</span> <span id="sc-pages-lbl">searchable items</span>
                    · <span id="sc-status">on</span>
                    · <span id="sc-engine">engine</span>
                </div>
            </div>
        </div>
    </div>
</div>
