# Runway Database — español
database.menu=Base de datos

database.group.connection=Conexión
database.group.connection.help=El servidor de base de datos al que se conecta Runway. Los cambios se aplican al reiniciar; en un clúster, todos los nodos necesitan los mismos valores.
database.group.limits=Límites
database.group.limits.help=Cuánto del servidor puede usar Runway y qué tamaño puede alcanzar el respaldo de la base de datos de un sitio.

database.set.provider=Proveedor
database.set.provider.help=El producto de base de datos. Instale también su plugin proveedor: database-postgresql o database-mariadb.
database.set.host=Servidor
database.set.host.help=Un nombre de host o una dirección IP. Un solo servidor.
database.set.port=Puerto
database.set.port.help=Déjelo en blanco para usar el predeterminado (5432 para PostgreSQL, 3306 para MariaDB).
database.set.database=Base de datos
database.set.database.help=Una base de datos existente en el servidor. Runway crea sus esquemas dentro de ella (en MariaDB, bases de datos junto a ella).
database.set.username=Usuario
database.set.password=Contraseña
database.set.tls=TLS
database.set.tls.help=verify-full comprueba el certificado y el nombre del servidor. require cifra sin comprobar quién es el servidor. Use disable solo para una base de datos en el mismo equipo o en una red privada de confianza.
database.set.caCertificate=Certificado de la CA (PEM)
database.set.caCertificate.help=La autoridad que firmó el certificado del servidor, cuando el almacén de confianza de Java no la conoce.
database.set.namespace=Espacio de nombres
database.set.namespace.help=El inicio de cada nombre de esquema que crea Runway. Dé uno distinto a cada instalación que comparta un servidor. Minúsculas y dígitos, empezando por una letra, hasta 12.
database.set.poolMax=Conexiones
database.set.poolMax.help=El máximo de conexiones que los plugins pueden usar a la vez. Un sitio puede usar como mucho la mitad.
database.set.statementTimeoutSeconds=Límite por sentencia (segundos)
database.set.statementTimeoutSeconds.help=Se detiene la sentencia de un plugin que tarde más. Las migraciones, los respaldos y las restauraciones tienen su propio límite, más largo.
database.set.backupBudgetMiB=Presupuesto de respaldo (MiB)
database.set.backupBudgetMiB.help=El tamaño comprimido que pueden alcanzar los datos de base de datos de un sitio en su respaldo. Para datos mayores, use las herramientas de respaldo de la propia base de datos.
database.set.collation=Intercalación (MariaDB)
database.set.collation.help=Para las tablas de los plugins en MariaDB. En blanco se usa utf8mb4_uca1400_ai_ci (utf8mb4_unicode_ci antes de MariaDB 10.10).

