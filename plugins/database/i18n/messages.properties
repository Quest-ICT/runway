# Runway Database — English
database.menu=Database

database.group.provider=Database product
database.group.provider.help=Which provider plugin Runway uses, and the names it gives its schemas. Changes apply after a restart; in a cluster every node needs the same values. The connection tests are below the form.

database.group.limits=Limits
database.group.limits.help=How much of the server Runway may use, and how large a site's database backup may be.

database.set.provider=Provider
database.set.provider.help=auto uses the one provider plugin installed. Choose a product only when both database-postgresql and database-mariadb are installed. The server, the account and TLS are set on the provider plugin's own settings page.
database.set.namespace=Namespace
database.set.namespace.help=The start of every schema name Runway creates. Give each installation that shares a server its own. Lower-case letters and digits, starting with a letter, up to 12.
database.set.poolMax=Connections
database.set.poolMax.help=The most connections plugins may hold at once. One site may use at most half.
database.set.statementTimeoutSeconds=Statement time limit (seconds)
database.set.statementTimeoutSeconds.help=A plugin's statement that runs longer is stopped. Migrations, backups and restores have their own, longer limit.
database.set.backupBudgetMiB=Backup budget (MiB)
database.set.backupBudgetMiB.help=The compressed size a site's database data may reach in its backup. Larger data needs the database's own backup tools.

