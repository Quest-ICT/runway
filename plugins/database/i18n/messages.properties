# Runway Database — English
database.menu=Database

database.group.connection=Connection
database.group.connection.help=The database server Runway connects to. Changes apply after a restart; in a cluster every node needs the same values.
database.group.limits=Limits
database.group.limits.help=How much of the server Runway may use, and how large a site's database backup may be.

database.set.provider=Provider
database.set.provider.help=The database product. Install its provider plugin too: database-postgresql or database-mariadb.
database.set.host=Host
database.set.host.help=A host name or an IP address. One server only.
database.set.port=Port
database.set.port.help=Leave blank for the product's default (5432 for PostgreSQL, 3306 for MariaDB).
database.set.database=Database
database.set.database.help=An existing database on the server. Runway creates its schemas inside it (on MariaDB, databases next to it).
database.set.username=Username
database.set.password=Password
database.set.tls=TLS
database.set.tls.help=verify-full checks the server's certificate and name. require encrypts without checking who the server is. Use disable only for a database on the same host or a private network you trust.
database.set.caCertificate=CA certificate (PEM)
database.set.caCertificate.help=The certificate authority that signed the server's certificate, when the Java trust store does not know it.
database.set.namespace=Namespace
database.set.namespace.help=The start of every schema name Runway creates. Give each installation that shares a server its own. Lower-case letters and digits, starting with a letter, up to 12.
database.set.poolMax=Connections
database.set.poolMax.help=The most connections plugins may hold at once. One site may use at most half.
database.set.statementTimeoutSeconds=Statement time limit (seconds)
database.set.statementTimeoutSeconds.help=A plugin's statement that runs longer is stopped. Migrations, backups and restores have their own, longer limit.
database.set.backupBudgetMiB=Backup budget (MiB)
database.set.backupBudgetMiB.help=The compressed size a site's database data may reach in its backup. Larger data needs the database's own backup tools.
database.set.collation=Collation (MariaDB)
database.set.collation.help=For plugins' tables on MariaDB. Blank uses utf8mb4_uca1400_ai_ci (utf8mb4_unicode_ci before MariaDB 10.10).

