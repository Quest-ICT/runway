<!-- Site dashboard card: whether this site keeps data in the database, its size, and the last database restore.
     Bare fragment; binding in dashboard.th.xml. -->
<div class="card" id="dbd">
    <div class="card-body">
        <h3 class="card-title mb-2" id="dbd-title">Database</h3>
        <p class="mb-1" id="dbd-has"><span id="dbd-has-text">This site keeps plugin data in the database.</span>
            <span class="text-secondary" id="dbd-size">0.0 MiB</span></p>
        <p class="text-secondary mb-1" id="dbd-none">This site keeps no data in the database.</p>
        <p class="small mb-0" id="dbd-restore"><span id="dbd-l-restore">Last database restore</span>:
            <span id="dbd-restore-text">text</span></p>
    </div>
</div>
