# Runway Contact plugin — English strings. Console labels resolve automatically; public-facing strings
# (contact.form.*, contact.success/error.*, contact.page.title) are looked up with Messages.site for the visitor's
# locale, and the plain-text answers of the operator actions (contact.page.*, contact.test.*) with
# Messages.console in the operator's console language.

# Grantable permission (permissions matrix label)
contact.perm.settings=Configure contact form

# Per-tenant settings form labels
contact.set.enabled=Enable contact form
contact.set.success=Thank-you message
contact.set.smtpHost=SMTP host
contact.set.smtpPort=SMTP port
contact.set.smtpAuth=SMTP authentication
contact.set.smtpUsername=SMTP username
contact.set.smtpPassword=SMTP password
contact.set.smtpStarttls=Use STARTTLS
contact.set.smtpSsl=Use SSL/TLS (SMTPS)
contact.set.fromAddress=From address
contact.set.toAddress=Send submissions to

# Dashboard card
contact.card.title=Contact
contact.card.submissions=submissions

# Admin status fragment
contact.admin.title=Contact submissions
contact.admin.empty=No submissions yet.
contact.admin.when=When
contact.admin.help=Contact help & reference
contact.admin.smtp=SMTP relay
contact.admin.smtp.ok=Configured
contact.admin.smtp.missing=Not configured
contact.admin.smtp.test=Send a test email
contact.admin.smtp.test.tip=Send a test message over this site's SMTP relay to verify the configuration

# SMTP test result (public text response of /contact/smtp-test)
contact.test.ok=Test message sent.
contact.test.notConfigured=No SMTP relay is configured for this site.
contact.test.providerMissing=Mail libraries are not available on the server, so email cannot be sent.
contact.test.failed=Test message failed:

# Ready-made "Contact page" install card (admin fragment) + install-action result text
contact.page.card.title=Contact page
contact.page.card.desc=Install a ready-made contact page carrying the form. It becomes a normal site page — edit, restyle, move or rename it from Pages.
contact.page.card.install=Install contact page
contact.page.card.install.tip=Seed a ready-made, editable contact page (idempotent — it never overwrites an existing page)
contact.page.card.badge=Installed
contact.page.card.at=Installed at
contact.page.card.edit=— edit it under Pages.
# install-page action result (plain text)
contact.page.title=Contact
contact.page.installed=Contact page installed at
contact.page.exists=A contact page already exists at
contact.page.failed=Could not install the contact page.
contact.page.pending=The contact page was created and is waiting in the review queue:
contact.page.blocked=The contact page was created as a draft because the quality checks blocked publishing; fix it in the page editor:
contact.page.other=The contact page install finished:

# Public-facing form + result
contact.heading=Contact
contact.form.name=Name
contact.form.email=Email
contact.form.message=Message
contact.form.submit=Send
contact.success=Thanks — your message has been sent.
contact.note.stored=Your message was received; email delivery is delayed.
contact.error.invalid=Please enter your email and a message.
contact.error.captcha=Please complete the challenge and try again.
