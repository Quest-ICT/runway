<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Blog entry</title>
    <!-- Static preview head only — replaced at render by the TENANT's master head (the seam contract). -->
</head>
<body>
<header id="site-header">Site header (from the master at render)</header>

<main id="content">
    <article class="blog-entry">
        <header class="blog-entry-header">
            <h1 id="entry-title">Entry title</h1>
            <p id="entry-meta" class="blog-entry-meta">
                <time id="entry-date">2026-01-01</time>
                <span id="entry-author">By Someone</span>
            </p>
        </header>
        <div id="entry-body" class="blog-entry-body">
            <p>The entry body renders here.</p>
        </div>
        <footer class="blog-entry-footer">
            <a id="entry-back" href="/">Back</a>
        </footer>
    </article>
</main>

<footer id="site-footer">Site footer (from the master at render)</footer>
</body>
</html>
