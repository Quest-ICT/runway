# Runway Database — PostgreSQL provider — español
database-postgresql.group.connection=Servidor
database-postgresql.group.connection.help=El servidor PostgreSQL donde Runway guarda los datos de los plugins. Los cambios se aplican al reiniciar; pruébelos antes con las pruebas de conexión de la página de ajustes del plugin Base de datos. En un clúster, todos los nodos necesitan los mismos valores.
database-postgresql.set.host=Servidor
database-postgresql.set.host.help=Un nombre de host o una dirección IP. Un solo servidor.
database-postgresql.set.port=Puerto
database-postgresql.set.port.help=Déjelo en blanco para usar el predeterminado de PostgreSQL, 5432.
database-postgresql.set.database=Base de datos
database-postgresql.set.database.help=Una base de datos existente en el servidor. Runway crea sus esquemas dentro de ella.
database-postgresql.set.username=Usuario
database-postgresql.set.password=Contraseña
database-postgresql.set.tls=TLS
database-postgresql.set.tls.help=verify-full comprueba el certificado y el nombre del servidor. require cifra sin comprobar quién es el servidor. Use disable solo para una base de datos en el mismo equipo o en una red privada de confianza.
database-postgresql.set.caCertificate=Certificado de la CA (PEM)
database-postgresql.set.caCertificate.help=La autoridad que firmó el certificado del servidor, cuando el almacén de confianza de Java no la conoce.
