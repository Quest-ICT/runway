# Runway Database — PostgreSQL provider — English
database-postgresql.group.connection=Server
database-postgresql.group.connection.help=The PostgreSQL server Runway keeps plugins' data on. Changes apply after a restart; test them first with the connection tests on the Database plugin's settings page. In a cluster every node needs the same values.
database-postgresql.set.host=Host
database-postgresql.set.host.help=A host name or an IP address. One server only.
database-postgresql.set.port=Port
database-postgresql.set.port.help=Leave blank for PostgreSQL's default, 5432.
database-postgresql.set.database=Database
database-postgresql.set.database.help=An existing database on the server. Runway creates its schemas inside it.
database-postgresql.set.username=Username
database-postgresql.set.password=Password
database-postgresql.set.tls=TLS
database-postgresql.set.tls.help=verify-full checks the server's certificate and name. require encrypts without checking who the server is. Use disable only for a database on the same host or a private network you trust.
database-postgresql.set.caCertificate=CA certificate (PEM)
database-postgresql.set.caCertificate.help=The certificate authority that signed the server's certificate, when the Java trust store does not know it.
