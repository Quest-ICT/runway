# =============================================================================
#  Runway Database — PostgreSQL provider
#  Lets the database plugin use PostgreSQL 14 or later. It brings the pgjdbc
#  driver (BSD-2-Clause, in lib/) and builds a configured DataSource; every
#  statement Runway runs is written in the database plugin.
#
#  The server, the account and TLS are set on THIS plugin's settings page
#  (since 2.0.0); the database plugin keeps the provider choice and the
#  limits. With both providers installed, choose this one with the database
#  plugin's `provider: postgresql` setting.
#
#  The install folder name MUST equal this `id`: external/plugins/database-postgresql/.
# =============================================================================
id: database-postgresql
name: Database — PostgreSQL
version: 2.0.0

mainClass: mx.quest.database.postgresql.PostgresProviderConfig

# The database plugin publishes the DatabaseProvider interface this plugin implements.
requires: [ "database >= 2.0.0" ]

# SPI 1.2.0: PluginSettings.savedApp, which hands the saved settings to the connection test.
requiresSpi: ">=1.2.0"

settingGroups:
  - { id: connection, label: database-postgresql.group.connection, help: database-postgresql.group.connection.help }

# Runway-wide settings, applied on RESTART. In a cluster every node needs the same values and the same platform
# secret key. Test them before restarting: Plugins -> Database -> Settings, "Connection tests".
settings:
  - { key: host, type: string, group: connection, label: database-postgresql.set.host, help: database-postgresql.set.host.help }
  - { key: port, type: int, range: "1..65535", group: connection, label: database-postgresql.set.port,
      help: database-postgresql.set.port.help }
  - { key: database, type: string, group: connection, label: database-postgresql.set.database,
      help: database-postgresql.set.database.help }
  - { key: username, type: string, group: connection, label: database-postgresql.set.username }
  # Bound to where it goes: changing any of these without typing the password again removes the stored one.
  - key: password
    type: secret
    group: connection
    label: database-postgresql.set.password
    secretBoundTo: [host, port, database, username, tls, caCertificate]
  - { key: tls, type: enum, range: "verify-full,require,disable", default: verify-full, group: connection,
      label: database-postgresql.set.tls, help: database-postgresql.set.tls.help }
  - { key: caCertificate, type: text, group: connection, advanced: true, label: database-postgresql.set.caCertificate,
      help: database-postgresql.set.caCertificate.help }
