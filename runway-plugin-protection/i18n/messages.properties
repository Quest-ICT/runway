# Settings form sections and help lines (1.0.0)
protection.group.ratelimit=Rate limit
protection.group.ratelimit.help=Every visitor's address gets a bucket of requests that refills over time. A request that finds it empty gets 429 Too Many Requests. Applies to every site and both consoles, before the site is known.
protection.group.autoblock=Auto-block
protection.group.autoblock.help=An address that keeps hitting the rate limit is blocked for a while. Auto-blocks are kept in memory and clear on restart; blocks you set on the DoS screen are kept.
protection.group.exempt=Exemptions
protection.group.exempt.help=Addresses the rate limit and auto-block never apply to.
protection.group.device=Remember this device
protection.group.device.help=After a login that solved the CAPTCHA, the device may skip the login CAPTCHA for a while. It never skips the password or the lockout.
protection.help.allowlist=One IP or CIDR per line, e.g. 203.0.113.7 or 198.51.100.0/24. For your own audits, probes and load tests. Loopback is not exempt unless listed: behind a same-host proxy every visitor arrives from loopback.
protection.help.rl.capacity=How many requests one address may make back to back before it is slowed down. Default 120.
protection.help.rl.refill=How many requests per second an address gets back after a burst. Default 2; 0.5 means one every two seconds. Must be above 0.
protection.help.ab.enabled=Off: an address over the limit only gets 429s and is never blocked.
protection.help.ab.threshold=How many 429s within the window before the address is blocked. Default 60.
protection.help.ab.window=The period the 429s are counted over. Default 60 seconds.
protection.help.ab.duration=How long an auto-block lasts; the visitor gets 429 with the remaining time in Retry-After. Default 900 (15 minutes).
protection.help.rd.enabled=Off: the login CAPTCHA is shown on every login.
protection.help.rd.days=How long a device is remembered, 1 to 365. Default 30.
