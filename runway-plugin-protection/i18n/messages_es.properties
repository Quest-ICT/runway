# Settings form sections and help lines (1.0.0)
protection.group.ratelimit=Límite de solicitudes
protection.group.ratelimit.help=Cada dirección de visitante tiene un depósito de solicitudes que se rellena con el tiempo. Una solicitud que lo encuentra vacío recibe 429 Too Many Requests. Se aplica a todos los sitios y a ambas consolas, antes de saber qué sitio es.
protection.group.autoblock=Bloqueo automático
protection.group.autoblock.help=Una dirección que choca una y otra vez con el límite queda bloqueada un tiempo. Los bloqueos automáticos viven en memoria y se borran al reiniciar; los que fijas en la pantalla DoS se conservan.
protection.group.exempt=Exenciones
protection.group.exempt.help=Direcciones a las que nunca se aplican el límite ni el bloqueo automático.
protection.group.device=Recordar este dispositivo
protection.group.device.help=Tras un inicio de sesión que resolvió el CAPTCHA, el dispositivo puede omitir el CAPTCHA de inicio de sesión durante un tiempo. Nunca omite la contraseña ni el bloqueo por intentos.
protection.help.allowlist=Una IP o CIDR por línea, p. ej. 203.0.113.7 o 198.51.100.0/24. Para tus auditorías, sondas y pruebas de carga. Loopback no está exento salvo que lo pongas: detrás de un proxy en el mismo equipo, todo visitante llega desde loopback.
protection.help.rl.capacity=Cuántas solicitudes seguidas puede hacer una dirección antes de que se la frene. Por omisión 120.
protection.help.rl.refill=Cuántas solicitudes por segundo recupera una dirección tras una ráfaga. Por omisión 2; 0.5 es una cada dos segundos. Debe ser mayor que 0.
protection.help.ab.enabled=Desactivado: una dirección que excede el límite solo recibe 429 y nunca se bloquea.
protection.help.ab.threshold=Cuántos 429 dentro de la ventana antes de bloquear la dirección. Por omisión 60.
protection.help.ab.window=El periodo en el que se cuentan los 429. Por omisión 60 segundos.
protection.help.ab.duration=Cuánto dura un bloqueo automático; el visitante recibe 429 con el tiempo restante en Retry-After. Por omisión 900 (15 minutos).
protection.help.rd.enabled=Desactivado: el CAPTCHA de inicio de sesión se muestra en cada inicio de sesión.
protection.help.rd.days=Cuánto tiempo se recuerda un dispositivo, de 1 a 365. Por omisión 30.
