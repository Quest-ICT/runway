<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>about runway</title></head>
<body>
<div id="content">
    <div class="page-header d-print-none mb-3">
        <div class="row align-items-center">
            <div class="col">
                <div class="page-pretitle" id="ab-pretitle">Application</div>
                <h2 class="page-title" id="ab-heading">About Runway</h2>
                <div class="text-secondary mt-1" id="ab-built">built</div>
            </div>
            <div class="col-auto">
                <span class="badge bg-azure-lt" id="ab-version">version</span>
            </div>
        </div>
    </div>

    <div class="row row-cards">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header"><h3 class="card-title" id="ec-title">Effective configuration</h3></div>
                <div class="card-body">
                    <p class="text-secondary" id="ec-note">Set in application.yml — a restart is needed to change these.</p>
                    <table class="table table-sm card-table">
                        <tbody id="ec-body">
                            <tr id="ec-row">
                                <th scope="row" id="ec-name" class="text-secondary fw-normal">setting</th>
                                <td id="ec-val" class="text-end font-monospace">value</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card">
                <div class="card-header"><h3 class="card-title" id="rt-title">Runtime environment</h3></div>
                <div class="card-body">
                    <p class="text-secondary" id="rt-note">Describes the node serving this page.</p>
                    <table class="table table-sm card-table">
                        <tbody id="rt-body">
                            <tr id="rt-row">
                                <th scope="row" id="rt-name" class="text-secondary fw-normal">name</th>
                                <td id="rt-val" class="text-end font-monospace">value</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="row row-cards mt-3">
        <div class="col-12">
            <div class="card">
                <div class="card-header"><h3 class="card-title" id="cmp-title">Bundled components</h3></div>
                <div class="card-body">
                    <p class="text-secondary" id="cmp-note">Notable third-party libraries in this build.</p>
                    <div class="rw-cmp-grid">
                        <div id="cmp-row" class="rw-cmp-item">
                            <span id="cmp-name" class="text-secondary">name</span>
                            <span id="cmp-val" class="font-monospace">value</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
