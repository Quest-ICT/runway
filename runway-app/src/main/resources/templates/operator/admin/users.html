<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>site users</title></head>
<body>
<div id="content">
    <div class="page-header d-print-none mb-3">
        <div class="row align-items-center">
            <div class="col">
                <div class="page-pretitle" id="tu-pretitle">Site</div>
                <h2 class="page-title" id="tu-heading">Users</h2>
            </div>
        </div>
    </div>

    <div class="row row-cards">
        <div class="col-md-8" id="tu-create-col">
            <div class="card">
                <div class="card-header"><h3 class="card-title" id="tu-create-title">Create a user</h3></div>
                <div class="card-body">
                    <form id="tu-create-form" method="post" action="/__admin/users/create" class="row g-2">
                        <input class="tu-csrf" type="hidden" name="_csrf" value="">
                        <div class="col-md-4"><label class="form-label" id="tu-l-user" for="tu-f-user">Username</label>
                            <input id="tu-f-user" class="form-control" name="username" required autocomplete="off"></div>
                        <div class="col-md-4"><label class="form-label" id="tu-l-pass" for="tu-f-pass">Password</label>
                            <input id="tu-f-pass" class="form-control" name="password" type="password" required autocomplete="new-password"></div>
                        <div class="col-md-4"><label class="form-label" id="tu-l-tier" for="tu-f-tier">Access tier</label>
                            <select id="tu-f-tier" class="form-select" name="tier">
                                <option value="OPERATOR" id="tu-tier-op">Operator</option>
                                <option value="ADMIN" id="tu-tier-admin">Administrator</option>
                            </select></div>
                        <div class="col-md-6"><label class="form-label" id="tu-l-name" for="tu-f-name">Display name</label>
                            <input id="tu-f-name" class="form-control" name="displayName"></div>
                        <div class="col-md-6"><label class="form-label" id="tu-l-email" for="tu-f-email">Email</label>
                            <input id="tu-f-email" class="form-control" name="email" type="email"></div>
                        <div class="col-12" id="tu-roles-group"><label class="form-label" id="tu-l-roles" for="tu-f-roles">Additional roles</label>
                            <select id="tu-f-roles" class="form-select" name="roles" multiple size="4">
                                <option class="tu-opt-role" value="">role</option>
                            </select>
                            <small class="form-hint" id="tu-roles-hint">Optional. Custom roles layered on top of the access tier.</small></div>
                        <div class="col-12"><button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-user-plus me-1"></i><span id="tu-create-btn">Create user</span></button></div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-4" id="tu-reset-col">
            <div class="card">
                <div class="card-header"><h3 class="card-title" id="tu-reset-title">Reset a password</h3></div>
                <div class="card-body">
                    <form id="tu-reset-form" method="post" class="row g-2">
                        <input class="tu-csrf" type="hidden" name="_csrf" value="">
                        <div class="col-12"><select class="form-select a11y-user" name="principalId" aria-label="User"><option class="tu-opt">u</option></select></div>
                        <div class="col-12"><input class="form-control a11y-newpass" name="password" type="password" required
                                                    autocomplete="new-password" placeholder="New password" aria-label="New password"></div>
                        <div class="col-12"><button type="submit" class="btn btn-outline-secondary w-100" id="tu-reset-btn">Reset</button></div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-12">
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-vcenter card-table" data-listing-table="runway.admin.users">
                        <thead>
                        <tr>
                            <th scope="col" data-col-key="user" id="tu-h-user">Username</th>
                            <th scope="col" data-col-key="name" id="tu-h-name">Display name</th>
                            <th scope="col" data-col-key="email" id="tu-h-email">Email</th>
                            <th scope="col" data-col-key="roles" id="tu-h-roles">Roles</th>
                            <th scope="col" data-nosort id="tu-h-actions" class="w-1">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr id="tu-empty"><td colspan="5" class="text-secondary text-center" id="tu-empty-text">No users.</td></tr>
                        <tr id="tu-row">
                            <td><span class="t-user">user</span> <span class="t-suspended badge bg-red-lt">suspended</span></td>
                            <td class="t-name text-secondary">—</td>
                            <td class="t-email text-secondary">—</td>
                            <td class="t-roles text-secondary">—</td>
                            <td class="text-nowrap">
                                <span class="t-readonly text-secondary small">—</span>
                                <button type="button" class="btn btn-sm btn-outline-primary t-edit-btn" data-bs-toggle="modal">Edit</button>
                                <div class="modal modal-blur fade t-edit-modal" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered" role="document">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title"><span class="t-edit-title">Edit user</span> · <span class="t-edit-user text-secondary">user</span></h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <form class="t-edit-form m-0" method="post">
                                                <div class="modal-body text-wrap">
                                                    <input class="t-csrf" type="hidden" name="_csrf" value="">
                                                    <label class="form-label w-100 mb-3"><span class="t-edit-l-name">Display name</span>
                                                        <input class="form-control mt-1 t-edit-name" name="displayName" maxlength="128" autocomplete="off"></label>
                                                    <label class="form-label w-100 mb-3"><span class="t-edit-l-email">Email</span>
                                                        <input class="form-control mt-1 t-edit-email" name="email" type="email" maxlength="254" autocomplete="off"></label>
                                                    <label class="form-label w-100 mb-0 t-edit-tier-group"><span class="t-edit-l-tier">Access tier</span>
                                                        <select class="form-select mt-1" name="tier">
                                                            <option value="OPERATOR" class="t-edit-tier-op">Operator</option>
                                                            <option value="ADMIN" class="t-edit-tier-admin">Administrator</option>
                                                        </select></label>
                                                    <small class="form-hint t-edit-tier-fixed">The access tier of this account cannot be changed here.</small>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-link link-secondary t-edit-cancel" data-bs-dismiss="modal">Cancel</button>
                                                    <button type="submit" class="btn btn-primary t-edit-save">Save</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                                <form class="t-suspend d-inline m-0" method="post">
                                    <input class="t-csrf" type="hidden" name="_csrf" value="">
                                    <button type="submit" class="btn btn-sm btn-outline-warning t-suspend-btn">Suspend</button>
                                </form>
                                <form class="t-resume d-inline m-0" method="post">
                                    <input class="t-csrf" type="hidden" name="_csrf" value="">
                                    <button type="submit" class="btn btn-sm btn-outline-success t-resume-btn">Resume</button>
                                </form>
                                <form class="t-delete d-inline m-0" method="post">
                                    <input class="t-csrf" type="hidden" name="_csrf" value="">
                                    <button type="submit" class="btn btn-sm btn-outline-danger t-del-btn">Delete</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
