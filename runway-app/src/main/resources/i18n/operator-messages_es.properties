op.pages.edit.gone.help=Solo surte efecto mientras la p\u00e1gina est\u00e1 sin publicar. Entonces la direcci\u00f3n responde \u00ab410 Gone\u00bb en lugar de \u00ab404 No encontrada\u00bb, lo que indica a los buscadores que la p\u00e1gina no va a volver y la retiran r\u00e1pido. D\u00e9jela desmarcada si la retira solo temporalmente.
