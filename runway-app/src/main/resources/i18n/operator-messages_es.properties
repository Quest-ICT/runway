op.pages.quality.heading=Calidad de la página
op.pages.quality.clean=Sin problemas.
op.pages.quality.i18nPath=Las URL no están localizadas: todos los idiomas usan la ruta «{0}». En el panel de Metadatos, complete el campo «Ruta localizada» de cada idioma para que cada URL coincida con el idioma de su contenido; es importante tras cambiar el idioma predeterminado.
op.pages.quality.underscorePath=La ruta de URL «{0}» usa guiones bajos. Es preferible usar guiones (-): los buscadores leen el guion como separador de palabras y el guion bajo como unión, así que «about-us» cuenta como dos palabras y «about_us» como una.
op.pages.quality.improperCharsPath=La ruta de URL «{0}» contiene caracteres que no deberían ir en una URL: un espacio o un símbolo (? # % & …) hay que codificarlo en porcentaje, lo que hace frágiles los enlaces y puede dejar la página inaccesible en la dirección que teclearía un visitante. Use solo letras minúsculas, números y guiones (-).
op.pages.quality.nonAsciiPath=La ruta de URL «{0}» usa letras no ASCII (é, ñ, ü, …). Funcionan, pero se codifican en porcentaje en los enlaces: «/niños» se comparte y guarda como «/ni%C3%B1os», que se ve desordenado y puede fallar en herramientas antiguas. Es aceptable para una ruta pensada para lectores de ese idioma; en caso contrario, una forma en ASCII («ninos», «cafe») es más portable y compatible con enlaces.
op.pages.quality.uppercasePath=La ruta de URL «{0}» tiene letras mayúsculas. Las URL distinguen mayúsculas y minúsculas (RFC 3986) y Runway las compara de forma exacta, así que «/About» y «/about» son direcciones distintas; use solo minúsculas para evitar enlaces rotos y URL duplicadas.
op.pages.quality.pathShadowsContent=La ruta “{0}” también la sirve contenido de un plugin ({1}). Una página publicada gana esta dirección — ese contenido queda inaccesible aquí mientras la página la conserve.
