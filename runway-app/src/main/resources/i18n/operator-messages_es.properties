quality.description.missing=La página no tiene descripción. Los buscadores escribirán su propio fragmento a partir del texto.
quality.description.too-short=La descripción tiene menos de 50 caracteres; entre 50 y 160 funciona mejor como fragmento.
quality.description.too-long=La descripción tiene más de 160 caracteres; los resultados de búsqueda la cortarán.
quality.h1.missing=La página no tiene encabezado principal (<h1>).
quality.h1.multiple=La página tiene más de un encabezado principal (<h1>). Use uno; a menudo la maestra también pone el nombre del sitio en un <h1>.
quality.heading.skipped=Los niveles de encabezado se saltan un nivel (por ejemplo <h2> seguido de <h4>), lo que rompe el esquema con el que navegan los lectores de pantalla.
quality.img.alt-missing=Una imagen no tiene atributo alt. Descríbala, o use alt="" si es puramente decorativa.
quality.link.empty=Un enlace no tiene texto que un lector de pantalla pueda anunciar (suele ser un enlace de solo ícono). Agregue texto o un aria-label.
quality.link.generic=Un enlace usa texto genérico como "haga clic aquí" o "leer más". Diga a dónde lleva.
quality.content.thin=La página tiene menos de 150 palabras de contenido. Puede estar bien (una página de contacto); si no, considere decir más.
quality.title.duplicate=Otra página publicada tiene el mismo título.
quality.description.duplicate=Otra página publicada tiene la misma descripción.

