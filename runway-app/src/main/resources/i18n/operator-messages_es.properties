# Ajustes del núcleo (kernel-settings.yml, generados con él)
op.ks.g.server.csp=Política de seguridad de contenido (CSP)
op.ks.g.server.csp.help=La política de seguridad que el navegador recibe con cada página. Limita de dónde pueden venir scripts, estilos, imágenes y marcos. Se aplica tras reiniciar.
op.ks.g.server.limits=Límites de solicitudes
op.ks.g.server.limits.help=Qué tan grande puede ser una solicitud. Se aplica tras reiniciar.
op.ks.g.server.storage=Almacenamiento de los sitios
op.ks.g.server.storage.help=Cuánto puede guardar cada sitio en sus archivos estáticos y documentos. El límite propio de un sitio, fijado en Sitios, prevalece sobre este valor. Se aplica tras reiniciar.
op.ks.g.server.cache=Caché HTTP
op.ks.g.server.cache.help=El encabezado Cache-Control con el que se envían páginas y archivos. El ajuste de caché de una página en el editor prevalece. Se aplica tras reiniciar.
op.ks.g.server.compression=Compresión de respuestas (ajuste fino)
op.ks.g.server.compression.help=Ajuste fino de los interruptores de compresión de arriba. Se aplica tras reiniciar.
op.ks.g.server.monitoring=Monitoreo
op.ks.g.server.monitoring.help=La sonda de salud que cada sitio responde en /__health, el endpoint de métricas y el endpoint de recarga de sitios. Se aplica tras reiniciar.
op.ks.g.server.logs=Registros de los sitios
op.ks.g.server.logs.help=El registro de accesos y auditoría de cada sitio (sus pantallas Registros e Información). Se aplica tras reiniciar.
op.ks.g.server.console=Idiomas de la consola
op.ks.g.server.console.help=Los idiomas que ofrece el selector de idioma de esta consola. Se aplica tras reiniciar.
op.ks.g.server.sessions=Sesiones
op.ks.g.server.sessions.help=Cuánto dura sin actividad una sesión iniciada en la consola. Se aplica tras reiniciar.
op.ks.g.server.proxy=Proxy inverso
op.ks.g.server.proxy.help=Si se confía en los encabezados X-Forwarded-* y desde qué direcciones. Solo de su propio proxy: si no, un visitante podría falsear su dirección. Se aplica tras reiniciar.
op.ks.g.server.capacity=Capacidad
op.ks.g.server.capacity.help=Hilos y límites de concurrencia. Los valores por omisión sirven para la mayoría de los servidores; súbalos solo ante una carga medida. Se aplica tras reiniciar.
op.ks.g.server.protection=Registro de la protección
op.ks.g.server.protection.help=Qué escribe en el registro la protección de solicitudes cuando rechaza una. Se aplica tras reiniciar.
op.ks.g.backups.policy=Política de copias de seguridad
op.ks.g.backups.policy.help=Copias automáticas de todos los sitios, y cuántas copias guardadas se conservan. Se aplica tras reiniciar.
op.ks.g.bandwidth.metering=Medición y cuota
op.ks.g.bandwidth.metering.help=El conteo de tráfico por sitio, su historial y el tope mensual. Se aplica tras reiniciar.
op.ks.g.activity.retention=Registro de actividad
op.ks.g.activity.retention.help=Cuánto tiempo se conserva el registro de actividad de la consola. Se aplica tras reiniciar.
op.ks.g.plugins.limits=Límites de complementos
op.ks.g.plugins.limits.help=Límites de tamaño al instalar complementos y para los archivos que los complementos guardan por sitio. Se aplica tras reiniciar.
op.ks.runway.csp.mode=Modo
op.ks.runway.csp.mode.help=report envía la política solo para informar (las violaciones se registran, nada se bloquea); enforce bloquea lo que la política no permite; off no envía política.
op.ks.runway.csp.strict-dynamic=Usar strict-dynamic (interruptor general)
op.ks.runway.csp.strict-dynamic.help=Un script cargado con el nonce de la página puede cargar otros. Activado: lo usan las páginas de la consola, y también las públicas mientras el interruptor de abajo esté activado. Desactivado, todas las páginas, de la consola y públicas, vuelven a las listas de hosts de abajo.
op.ks.runway.csp.public-strict-dynamic=Usar strict-dynamic en páginas públicas
op.ks.runway.csp.public-strict-dynamic.help=Las páginas públicas también reciben nonce y strict-dynamic. Necesita el interruptor de arriba.
op.ks.runway.csp.extra-hosts=Hosts permitidos adicionales (todos los sitios)
op.ks.runway.csp.extra-hosts.help=Las páginas de todos los sitios pueden cargar desde estos hosts, p. ej. https://www.youtube.com. Se añaden a scripts, estilos, imágenes, fuentes, conexiones y marcos. Para un host que solo necesita un sitio, use Configuración → Hosts para incrustar.
op.ks.runway.csp.upgrade-insecure-requests=Actualizar solicitudes inseguras
op.ks.runway.csp.upgrade-insecure-requests.help=El navegador pide los recursos http:// por https://.
op.ks.runway.csp.report-uri=URI de informes
op.ks.runway.csp.report-uri.help=A dónde envían los navegadores los informes de violaciones. Por omisión, el colector de Runway, que los escribe en el registro. En blanco vuelve al valor por omisión; para no enviar informes, ponga runway.csp.report-uri: "" en external/application.yml.
op.ks.runway.csp.default-src=default-src
op.ks.runway.csp.default-src.help=La lista de orígenes para todo lo que no tiene su propia directiva. En blanco vuelve a 'self'; para omitir la directiva, ponga la clave en "" en external/application.yml.
op.ks.runway.csp.script-src=script-src
op.ks.runway.csp.script-src.help=Orígenes de scripts. Siempre se añade el nonce de la página (y strict-dynamic, si está activo).
op.ks.runway.csp.style-src=style-src
op.ks.runway.csp.style-src.help=Orígenes de estilos.
op.ks.runway.csp.img-src=img-src
op.ks.runway.csp.img-src.help=Orígenes de imágenes.
op.ks.runway.csp.font-src=font-src
op.ks.runway.csp.font-src.help=Orígenes de fuentes.
op.ks.runway.csp.connect-src=connect-src
op.ks.runway.csp.connect-src.help=A dónde pueden conectarse los scripts (fetch, XHR, WebSocket).
op.ks.runway.csp.base-uri=base-uri
op.ks.runway.csp.base-uri.help=Valores permitidos del elemento <base> de una página.
op.ks.runway.csp.form-action=form-action
op.ks.runway.csp.form-action.help=A dónde pueden enviarse los formularios.
op.ks.runway.csp.frame-ancestors=frame-ancestors
op.ks.runway.csp.frame-ancestors.help=Qué sitios pueden mostrar estas páginas en un marco. 'none' lo prohíbe.
op.ks.runway.endpoints.max-form-bytes=Solicitud máxima sin sesión (bytes)
op.ks.runway.endpoints.max-form-bytes.help=Lo máximo que un visitante sin sesión puede enviar en una solicitud, en cualquier ruta. Por omisión 262144 (256 KiB).
op.ks.runway.http.min-request-data-rate=Cuerpo de solicitud más lento (bytes por segundo)
op.ks.runway.http.min-request-data-rate.help=Un cuerpo de solicitud que llega más despacio recibe 408 Request Timeout, así que un cliente que envía un byte de vez en cuando no puede ocupar un hilo de solicitud. Se mide sobre lo recibido desde el primer byte del cuerpo. Por omisión 4096; 0 desactiva la comprobación.
op.ks.runway.endpoints.max-body-bytes=Solicitud máxima a un complemento (bytes)
op.ks.runway.endpoints.max-body-bytes.help=Lo máximo que un usuario con sesión puede enviar a una ruta de un complemento. Por omisión 10485760 (10 MiB).
op.ks.spring.servlet.multipart.max-file-size=Archivo subido máximo
op.ks.spring.servlet.multipart.max-file-size.help=Para subidas como una copia a restaurar. Un tamaño como 256MB o 1GB. Por omisión 256MB.
op.ks.spring.servlet.multipart.max-request-size=Solicitud de subida máxima
op.ks.spring.servlet.multipart.max-request-size.help=Todos los archivos de una subida juntos. Un tamaño como 256MB. Por omisión 256MB.
op.ks.runway.static-files.default-max-bytes=Almacenamiento por sitio (bytes)
op.ks.runway.static-files.default-max-bytes.help=Lo máximo que pueden ocupar en disco los archivos estáticos y los documentos de un sitio. Una subida que lo superaría se rechaza; no se borra ni se oculta nada de lo ya guardado, y un sitio que lo supera puede seguir borrando. 0: sin límite. Por omisión 0.
op.ks.runway.http-cache.public-pages=Páginas públicas
op.ks.runway.http-cache.public-pages.help=Por omisión: navegadores y cachés guardan una página 5 minutos y pueden servirla 1 minuto más mientras la renuevan.
op.ks.runway.http-cache.assets=Archivos del sitio
op.ks.runway.http-cache.assets.help=Archivos bajo /static/ de un sitio (salvo los tipos inmutables de abajo). Por omisión: un día.
op.ks.runway.http-cache.plugin-assets=Archivos de complementos
op.ks.runway.http-cache.plugin-assets.help=Archivos que los complementos sirven bajo /__plugin/ (sus estilos y scripts). Por omisión: una hora; después se comprueba contra el contenido del archivo.
op.ks.runway.http-cache.immutable-extensions=Tipos de archivo inmutables
op.ks.runway.http-cache.immutable-extensions.help=Extensiones que se sirven como si nunca cambiaran (fuentes, por omisión). Cambie el nombre de esos archivos cuando cambien.
op.ks.runway.http-cache.immutable-assets=Archivos inmutables
op.ks.runway.http-cache.immutable-assets.help=El encabezado de los tipos de arriba. Por omisión: un año, inmutable.
op.ks.runway.compression.gzip.min-size=Cuerpo mínimo para gzip (bytes)
op.ks.runway.compression.gzip.min-size.help=Por omisión 1024.
op.ks.runway.compression.brotli.min-size=Cuerpo mínimo para Brotli (bytes)
op.ks.runway.compression.brotli.min-size.help=Por omisión 1024.
op.ks.runway.compression.brotli.quality=Calidad de Brotli
op.ks.runway.compression.brotli.quality.help=0 es lo más rápido, 11 lo más pequeño; de 4 a 6 sirve para comprimir al vuelo. Por omisión 5.
op.ks.runway.compression.max-buffer-bytes=Cuerpo máximo a comprimir (bytes)
op.ks.runway.compression.max-buffer-bytes.help=Las respuestas más grandes se envían sin comprimir. Por omisión 4194304 (4 MiB).
op.ks.runway.compression.mime-types=Tipos de contenido comprimidos
op.ks.runway.compression.mime-types.help=La lista completa: lo que escriba la reemplaza.
op.ks.runway.health.enabled=Responder la sonda de salud (/__health)
op.ks.runway.health.enabled.help=Desactivado: /__health no se sirve.
op.ks.runway.health.content-check=Revisar también el contenido
op.ks.runway.health.content-check.help=La sonda también comprueba que existan la página de inicio y la plantilla maestra.
op.ks.runway.health.content-check-ttl-seconds=Resultado de la revisión guardado (segundos)
op.ks.runway.health.content-check-ttl-seconds.help=Por omisión 10.
op.ks.runway.health.token=Token de detalle de salud
op.ks.runway.health.token.help=Una sonda que lo envía como token Bearer recibe el detalle. Sin token: solo la respuesta pública. En blanco se conserva el token guardado; escriba uno nuevo para reemplazarlo.
op.ks.runway.metrics.scrape-token=Token para métricas
op.ks.runway.metrics.scrape-token.help=Permite que un sistema de monitoreo lea /actuator/prometheus con este token Bearer. Sin token: solo operadores con sesión. En blanco se conserva el token guardado; escriba uno nuevo para reemplazarlo.
op.ks.runway.reload.enabled=Endpoint de recarga de sitios
op.ks.runway.reload.enabled.help=Permite que un script de despliegue haga que un sitio relea sus archivos. Inactivo hasta fijar el token.
op.ks.runway.reload.token=Token de recarga
op.ks.runway.reload.token.help=El token Bearer que exige el endpoint de recarga. En blanco se conserva el token guardado; escriba uno nuevo para reemplazarlo.
op.ks.runway.logs.enabled=Guardar registros de los sitios
op.ks.runway.logs.enabled.help=Desactivado: ningún sitio registra nuevos accesos ni auditoría; la pantalla Registros conserva las líneas ya escritas, Información no muestra nada.
op.ks.runway.logs.max-retention-days=Máximo que un sitio guarda sus registros (días)
op.ks.runway.logs.max-retention-days.help=Cada sitio elige su retención hasta este valor. Por omisión 90.
op.ks.runway.logs.access-log-user-agent=Registrar el navegador (User-Agent)
op.ks.runway.logs.access-log-user-agent.help=Añade el User-Agent a cada línea de acceso.
op.ks.runway.logs.queue-capacity=Tamaño de la cola de registro (líneas)
op.ks.runway.logs.queue-capacity.help=Líneas en espera de escribirse; más allá se descartan y se cuentan. Por omisión 8192.
op.ks.runway.operator.ui-languages=Idiomas ofrecidos
op.ks.runway.operator.ui-languages.help=Códigos de idioma en orden de aparición. Cada uno necesita una traducción de la consola: en y es vienen incluidos, otros van en external/i18n/.
op.ks.runway.operator.default-language=Idioma por omisión
op.ks.runway.operator.default-language.help=Se usa cuando el navegador no pide ninguno de los idiomas ofrecidos.
op.ks.server.servlet.session.timeout=Caducidad por inactividad
op.ks.server.servlet.session.timeout.help=Una duración como 30m, 2h o 1d. Por omisión 30m.
op.ks.runway.proxy.forwarded-headers=Leer encabezados X-Forwarded-*
op.ks.runway.proxy.forwarded-headers.help=Solo de las direcciones de confianza de abajo.
op.ks.runway.proxy.trusted-cidrs=Direcciones de proxy de confianza
op.ks.runway.proxy.trusted-cidrs.help=La dirección exacta de su proxy inverso, p. ej. 10.0.0.5/32, y la de cada proxy delante de él (una CDN). Compruebe el resultado en Acerca de Runway → Esta solicitud. Un /0 (0.0.0.0/0, ::/0), o rangos que juntos cubren todas las direcciones (0.0.0.0/1 con 128.0.0.0/1), dejaría que cualquier cliente falsee su dirección, así que se rechaza.
op.ks.server.jetty.threads.max=Hilos de solicitud máximos
op.ks.server.jetty.threads.max.help=Por omisión 200.
op.ks.server.jetty.threads.min=Hilos de solicitud mínimos
op.ks.server.jetty.threads.min.help=Por omisión 8; nunca más que el máximo.
op.ks.runway.i18n.cache-seconds=Revisión de archivos de mensajes (segundos)
op.ks.runway.i18n.cache-seconds.help=Cada cuánto se revisa si los archivos de mensajes de un sitio cambiaron fuera de la consola (lo guardado en Mensajes se aplica de inmediato). 0: en cada uso. Por omisión 5.
op.ks.spring.task.scheduling.pool.size=Hilos del programador
op.ks.spring.task.scheduling.pool.size.help=Hilos para copias y tareas de complementos. Por omisión 4.
op.ks.runway.security.max-concurrent-hashes=Comprobaciones de contraseña simultáneas
op.ks.runway.security.max-concurrent-hashes.help=Cada una usa unos 19 MiB (32 MiB con el perfil Alto). Más allá, los inicios de sesión esperan. Por omisión 8.
op.ks.runway.security.acquire-timeout-millis=Espera máxima por una comprobación (ms)
op.ks.runway.security.acquire-timeout-millis.help=Después el inicio de sesión responde "ocupado". Por omisión 2000.
op.ks.runway.protect.log-rejections=Registrar solicitudes rechazadas
op.ks.runway.protect.log-rejections.help=Una línea por solicitud rechazada (403 o 429). El conteo en las métricas se mantiene igual.
op.ks.runway.protect.log-rejection-window-seconds=Repeticiones suprimidas durante (segundos)
op.ks.runway.protect.log-rejection-window-seconds.help=Para la misma dirección y motivo; la siguiente línea dice cuántas se suprimieron. Por omisión 60.
op.ks.runway.backups.schedule.enabled=Hacer copia de todos los sitios automáticamente
op.ks.runway.backups.schedule.enabled.help=Según el horario de abajo.
op.ks.runway.backups.schedule.cron=Horario
op.ks.runway.backups.schedule.cron.help=Seis campos: segundo minuto hora día mes día-de-la-semana. Por omisión 0 30 2 * * * (02:30 cada día).
op.ks.runway.backups.retention.max-count=Copias guardadas por sitio
op.ks.runway.backups.retention.max-count.help=Se conservan las más recientes; 0 las conserva todas. Por omisión 30.
op.ks.runway.backups.retention.max-age-days=Borrar copias guardadas de más de (días)
op.ks.runway.backups.retention.max-age-days.help=0: sin límite de antigüedad. Por omisión 0.
op.ks.runway.backups.max-entry-bytes=Archivo máximo dentro de una copia a restaurar (bytes)
op.ks.runway.backups.max-entry-bytes.help=Protege contra archivos que se expanden sin límite. Por omisión 268435456 (256 MiB).
op.ks.runway.bandwidth.enabled=Contar el tráfico de cada sitio
op.ks.runway.bandwidth.enabled.help=Desactivado: no se cuenta nada nuevo y no se aplica ningún tope; las pantallas de Ancho de banda conservan el historial ya registrado.
op.ks.runway.bandwidth.quota.default-monthly-bytes=Tope mensual por sitio (bytes)
op.ks.runway.bandwidth.quota.default-monthly-bytes.help=Bytes salientes de los últimos 30 días; por encima, las páginas públicas del sitio responden 503 (su consola sigue funcionando). 0: sin tope. El tope propio de un sitio se fija en Sitios.
op.ks.runway.bandwidth.retention-days=Conservar el historial de tráfico (días)
op.ks.runway.bandwidth.retention-days.help=Por omisión 90.
op.ks.runway.bandwidth.snapshot-seconds=Intervalo de conteo (segundos)
op.ks.runway.bandwidth.snapshot-seconds.help=También cada cuánto se revisa el tope. Por omisión 60.
op.ks.runway.app-activity.retention-days=Conservar el registro de actividad (días)
op.ks.runway.app-activity.retention-days.help=Por omisión 90. Apagar el registro solo se fija en el servidor, para que no puedan hacerlo las personas a quienes registra.
op.ks.runway.plugins.max-entry-bytes=Archivo máximo dentro de un complemento a instalar (bytes)
op.ks.runway.plugins.max-entry-bytes.help=Por omisión 134217728 (128 MiB).
op.ks.runway.plugins.site-files.max-write-bytes=Archivo máximo que un complemento guarda por sitio (bytes)
op.ks.runway.plugins.site-files.max-write-bytes.help=Por omisión 16777216 (16 MiB).
