op.pages.edit.cacheControl.help=Reemplaza la cabecera Cache-Control enviada para esta página, controlando cuánto tiempo puede almacenarla en caché una CDN o un navegador. Déjelo en blanco para usar el valor predeterminado de la plataforma. El ETag de la página sigue actualizando las cachés cada vez que cambia su contenido.
