# Kernel settings (kernel-settings.yml, generated with it)
op.ks.g.server.csp=Content-Security-Policy
op.ks.g.server.csp.help=The browser security policy every page is sent with. It limits where scripts, styles, images and frames may come from. Applies after a restart.
op.ks.g.server.limits=Request limits
op.ks.g.server.limits.help=How large a request may be. Applies after a restart.
op.ks.g.server.storage=Site storage
op.ks.g.server.storage.help=How much each site may keep in its static files and documents. A site's own limit, set on Sites, wins over this default. Applies after a restart.
op.ks.g.server.cache=HTTP caching
op.ks.g.server.cache.help=The Cache-Control header pages and files are sent with. A page's own cache setting in the page editor wins over these. Applies after a restart.
op.ks.g.server.compression=Response compression (tuning)
op.ks.g.server.compression.help=Fine-tuning for the compression switches above. Applies after a restart.
op.ks.g.server.monitoring=Monitoring
op.ks.g.server.monitoring.help=The health probe each site answers at /__health, the metrics endpoint, and the site reload endpoint. Applies after a restart.
op.ks.g.server.logs=Site logs
op.ks.g.server.logs.help=The access and audit log each site keeps (its Logs and Insights screens). Applies after a restart.
op.ks.g.server.console=Console languages
op.ks.g.server.console.help=The languages this console's language switcher offers. Applies after a restart.
op.ks.g.server.sessions=Sessions
op.ks.g.server.sessions.help=How long a signed-in console session lasts without activity. Applies after a restart.
op.ks.g.server.proxy=Reverse proxy
op.ks.g.server.proxy.help=Whether to trust X-Forwarded-* headers, and from which addresses. Only from your own proxy: otherwise visitors could fake their address. Applies after a restart.
op.ks.g.server.capacity=Capacity
op.ks.g.server.capacity.help=Threads and concurrency limits. The defaults suit most servers; raise them only for measured load. Applies after a restart.
op.ks.g.server.protection=Protection logging
op.ks.g.server.protection.help=What the request protection writes to the log when it refuses a request. Applies after a restart.
op.ks.g.backups.policy=Backup policy
op.ks.g.backups.policy.help=Automatic backups of every site, and how many stored backups are kept. Applies after a restart.
op.ks.g.bandwidth.metering=Metering and quota
op.ks.g.bandwidth.metering.help=Per-site traffic counting, its history, and the monthly cap. Applies after a restart.
op.ks.g.activity.retention=Activity log
op.ks.g.activity.retention.help=How long the console's activity log is kept. Applies after a restart.
op.ks.g.plugins.limits=Plugin limits
op.ks.g.plugins.limits.help=Size limits for installing plugins and for the files plugins keep per site. Applies after a restart.
op.ks.runway.csp.mode=Mode
op.ks.runway.csp.mode.help=report sends the policy as report-only (violations are logged, nothing is blocked); enforce blocks what the policy does not allow; off sends no policy.
op.ks.runway.csp.strict-dynamic=Use strict-dynamic (master switch)
op.ks.runway.csp.strict-dynamic.help=A script the page loaded with its nonce may load further scripts. On: console pages use it, and public pages too while the switch below is on. Off rolls every page, console and public, back to the host lists below.
op.ks.runway.csp.public-strict-dynamic=Use strict-dynamic on public pages
op.ks.runway.csp.public-strict-dynamic.help=Public pages get a nonce and strict-dynamic too. Needs the switch above.
op.ks.runway.csp.extra-hosts=Extra allowed hosts (all sites)
op.ks.runway.csp.extra-hosts.help=Every site's pages may load from these hosts, e.g. https://www.youtube.com. They are added to scripts, styles, images, fonts, connections and frames. For a host only one site needs, use Settings → Embed hosts instead.
op.ks.runway.csp.upgrade-insecure-requests=Upgrade insecure requests
op.ks.runway.csp.upgrade-insecure-requests.help=The browser fetches http:// resources over https:// instead.
op.ks.runway.csp.report-uri=Report URI
op.ks.runway.csp.report-uri.help=Where browsers send violation reports. The default is Runway's own collector, which writes them to the log. A blank field restores this default; to send no reports at all, set runway.csp.report-uri: "" in external/application.yml.
op.ks.runway.csp.default-src=default-src
op.ks.runway.csp.default-src.help=The source list for anything without its own directive. A blank field restores 'self'; to leave the directive out, set the key to "" in external/application.yml.
op.ks.runway.csp.script-src=script-src
op.ks.runway.csp.script-src.help=Script sources. The page's nonce (and strict-dynamic, when on) is always added.
op.ks.runway.csp.style-src=style-src
op.ks.runway.csp.style-src.help=Style sources.
op.ks.runway.csp.img-src=img-src
op.ks.runway.csp.img-src.help=Image sources.
op.ks.runway.csp.font-src=font-src
op.ks.runway.csp.font-src.help=Font sources.
op.ks.runway.csp.connect-src=connect-src
op.ks.runway.csp.connect-src.help=Where scripts may connect (fetch, XHR, WebSocket).
op.ks.runway.csp.base-uri=base-uri
op.ks.runway.csp.base-uri.help=Allowed values of a page's <base> element.
op.ks.runway.csp.form-action=form-action
op.ks.runway.csp.form-action.help=Where forms may submit.
op.ks.runway.csp.frame-ancestors=frame-ancestors
op.ks.runway.csp.frame-ancestors.help=Which sites may show these pages in a frame. 'none' forbids all.
op.ks.runway.endpoints.max-form-bytes=Largest request before sign-in (bytes)
op.ks.runway.endpoints.max-form-bytes.help=The most a visitor who is not signed in may send in one request, on any path. Default 262144 (256 KiB).
op.ks.runway.http.min-request-data-rate=Slowest request body (bytes per second)
op.ks.runway.http.min-request-data-rate.help=A request body arriving more slowly is answered 408 Request Timeout: login and other forms, uploads and raw bodies alike, so a client sending a byte now and then cannot keep a request thread. Only time spent waiting for the client counts, and a body that has arrived complete is never refused. Sending part of a body fast earns at most 30 seconds of waiting. Default 4096; 0 turns the check off.
op.ks.runway.endpoints.max-body-bytes=Largest request to a plugin (bytes)
op.ks.runway.endpoints.max-body-bytes.help=The most a signed-in user may send to a plugin's route. Default 10485760 (10 MiB).
op.ks.spring.servlet.multipart.max-file-size=Largest uploaded file
op.ks.spring.servlet.multipart.max-file-size.help=For uploads such as a backup to restore. A size like 256MB or 1GB. Default 256MB.
op.ks.spring.servlet.multipart.max-request-size=Largest upload request
op.ks.spring.servlet.multipart.max-request-size.help=All the files of one upload together. A size like 256MB. Default 256MB.
op.ks.runway.static-files.default-max-bytes=Storage per site (bytes)
op.ks.runway.static-files.default-max-bytes.help=The most a site's static files and documents may take on disk. An upload that would go over it is refused; nothing already stored is deleted or hidden, and a site over it can still delete. 0: no limit. Default 0.
op.ks.runway.http-cache.public-pages=Public pages
op.ks.runway.http-cache.public-pages.help=Default: browsers and caches keep a page 5 minutes and may serve it 1 more minute while refreshing.
op.ks.runway.http-cache.assets=Site files
op.ks.runway.http-cache.assets.help=Files under a site's /static/ (except the immutable kinds below). Default: one day.
op.ks.runway.http-cache.plugin-assets=Plugin files
op.ks.runway.http-cache.plugin-assets.help=Files plugins serve under /__plugin/ (their styles and scripts). Default: one hour, then checked against the file's content.
op.ks.runway.http-cache.immutable-extensions=Immutable file types
op.ks.runway.http-cache.immutable-extensions.help=Extensions served as never changing (fonts by default). Give such files a new name when they change.
op.ks.runway.http-cache.immutable-assets=Immutable files
op.ks.runway.http-cache.immutable-assets.help=The header for the types above. Default: one year, immutable.
op.ks.runway.compression.gzip.min-size=Smallest body to gzip (bytes)
op.ks.runway.compression.gzip.min-size.help=Default 1024.
op.ks.runway.compression.brotli.min-size=Smallest body to Brotli-encode (bytes)
op.ks.runway.compression.brotli.min-size.help=Default 1024.
op.ks.runway.compression.brotli.quality=Brotli quality
op.ks.runway.compression.brotli.quality.help=0 is fastest, 11 smallest; 4 to 6 suit compressing on the fly. Default 5.
op.ks.runway.compression.max-buffer-bytes=Largest body to compress (bytes)
op.ks.runway.compression.max-buffer-bytes.help=Larger responses are sent uncompressed. Default 4194304 (4 MiB).
op.ks.runway.compression.mime-types=Compressed content types
op.ks.runway.compression.mime-types.help=The whole list: what you enter replaces it.
op.ks.runway.health.enabled=Answer the health probe (/__health)
op.ks.runway.health.enabled.help=Off: /__health is not served.
op.ks.runway.health.content-check=Check the site's content too
op.ks.runway.health.content-check.help=The probe also checks that the home page and the master template are there.
op.ks.runway.health.content-check-ttl-seconds=Content check result kept for (seconds)
op.ks.runway.health.content-check-ttl-seconds.help=Default 10.
op.ks.runway.health.token=Health detail token
op.ks.runway.health.token.help=A probe that sends it as a Bearer token gets the detailed body. Never set: only the public answer. A blank field keeps the stored token; type a new one to replace it.
op.ks.runway.metrics.scrape-token=Metrics scrape token
op.ks.runway.metrics.scrape-token.help=Lets a monitoring system read /actuator/prometheus with this Bearer token. Never set: only signed-in operators can. A blank field keeps the stored token; type a new one to replace it.
op.ks.runway.reload.enabled=Site reload endpoint
op.ks.runway.reload.enabled.help=Lets a deployment script make a site re-read its files. Inactive until the token is set.
op.ks.runway.reload.token=Reload token
op.ks.runway.reload.token.help=The Bearer token the reload endpoint requires. A blank field keeps the stored token; type a new one to replace it.
op.ks.runway.logs.enabled=Keep site logs
op.ks.runway.logs.enabled.help=Off: no site records new access or audit lines; the Logs screen keeps the lines already written, Insights shows nothing.
op.ks.runway.logs.max-retention-days=Longest a site may keep its logs (days)
op.ks.runway.logs.max-retention-days.help=Each site chooses its own retention up to this. Default 90.
op.ks.runway.logs.access-log-user-agent=Record the browser (User-Agent)
op.ks.runway.logs.access-log-user-agent.help=Adds the User-Agent to each access line.
op.ks.runway.logs.queue-capacity=Log queue size (lines)
op.ks.runway.logs.queue-capacity.help=Lines waiting to be written; beyond it lines are dropped and counted. Default 8192.
op.ks.runway.operator.ui-languages=Languages offered
op.ks.runway.operator.ui-languages.help=Language codes in display order. Each needs a console translation: en and es ship, others go in external/i18n/.
op.ks.runway.operator.default-language=Default language
op.ks.runway.operator.default-language.help=Used when the browser asks for none of the languages offered.
op.ks.server.servlet.session.timeout=Idle session timeout
op.ks.server.servlet.session.timeout.help=A duration such as 30m, 2h or 1d. Default 30m.
op.ks.runway.proxy.forwarded-headers=Read X-Forwarded-* headers
op.ks.runway.proxy.forwarded-headers.help=From the trusted addresses below only.
op.ks.runway.proxy.trusted-cidrs=Trusted proxy addresses
op.ks.runway.proxy.trusted-cidrs.help=The exact address of your reverse proxy, e.g. 10.0.0.5/32, and of every proxy in front of it (a CDN). Check the result under About Runway → This request. A /0 (0.0.0.0/0, ::/0), or ranges that add up to every address (0.0.0.0/1 with 128.0.0.0/1), would trust every client to fake its address, so it is refused.
op.ks.server.jetty.threads.max=Most request threads
op.ks.server.jetty.threads.max.help=Default 200.
op.ks.server.jetty.threads.min=Fewest request threads
op.ks.server.jetty.threads.min.help=Default 8; never above the most.
op.ks.runway.i18n.cache-seconds=Message file re-check (seconds)
op.ks.runway.i18n.cache-seconds.help=How often a site's message files are checked for changes made outside the console (Messages screen saves apply at once). 0: on every use. Default 5.
op.ks.spring.task.scheduling.pool.size=Scheduler threads
op.ks.spring.task.scheduling.pool.size.help=Threads for backups and plugin jobs. Default 4.
op.ks.runway.security.max-concurrent-hashes=Password checks at once
op.ks.runway.security.max-concurrent-hashes.help=Each takes about 19 MiB (32 MiB with the High profile). Beyond it, sign-ins wait. Default 8.
op.ks.runway.security.acquire-timeout-millis=Longest wait for a password check (ms)
op.ks.runway.security.acquire-timeout-millis.help=Then the sign-in answers "busy". Default 2000.
op.ks.runway.protect.log-rejections=Log refused requests
op.ks.runway.protect.log-rejections.help=One line per refused request (403 or 429). The count in the metrics is kept either way.
op.ks.runway.protect.log-rejection-window-seconds=Repeat lines suppressed for (seconds)
op.ks.runway.protect.log-rejection-window-seconds.help=For the same address and reason; the next line says how many were suppressed. Default 60.
op.ks.runway.backups.schedule.enabled=Back up every site automatically
op.ks.runway.backups.schedule.enabled.help=On the schedule below.
op.ks.runway.backups.schedule.cron=Schedule
op.ks.runway.backups.schedule.cron.help=Six fields: second minute hour day month weekday. Default 0 30 2 * * * (02:30 every day).
op.ks.runway.backups.retention.max-count=Stored backups kept per site
op.ks.runway.backups.retention.max-count.help=The newest this many are kept; 0 keeps all. Default 30.
op.ks.runway.backups.retention.max-age-days=Delete stored backups older than (days)
op.ks.runway.backups.retention.max-age-days.help=0: no age limit. Default 0.
op.ks.runway.backups.max-entry-bytes=Largest file inside a backup to restore (bytes)
op.ks.runway.backups.max-entry-bytes.help=A guard against archives that expand without limit. Default 268435456 (256 MiB).
op.ks.runway.bandwidth.enabled=Count each site's traffic
op.ks.runway.bandwidth.enabled.help=Off: nothing new is counted and no cap is enforced; the Bandwidth screens keep the history already recorded.
op.ks.runway.bandwidth.quota.default-monthly-bytes=Monthly cap per site (bytes)
op.ks.runway.bandwidth.quota.default-monthly-bytes.help=Outbound bytes in the last 30 days; above it the site's public pages answer 503 (its console keeps working). 0: no cap. A site's own cap is set on Sites.
op.ks.runway.bandwidth.retention-days=Keep traffic history (days)
op.ks.runway.bandwidth.retention-days.help=Default 90.
op.ks.runway.bandwidth.snapshot-seconds=Counting interval (seconds)
op.ks.runway.bandwidth.snapshot-seconds.help=Also how often the cap is checked. Default 60.
op.ks.runway.app-activity.retention-days=Keep the activity log (days)
op.ks.runway.app-activity.retention-days.help=Default 90. Switching the log off is set on the server only, so it cannot be done by the people it records.
op.ks.runway.plugins.max-entry-bytes=Largest file inside a plugin to install (bytes)
op.ks.runway.plugins.max-entry-bytes.help=Default 134217728 (128 MiB).
op.ks.runway.plugins.site-files.max-write-bytes=Largest file a plugin keeps per site (bytes)
op.ks.runway.plugins.site-files.max-write-bytes.help=Default 16777216 (16 MiB).
