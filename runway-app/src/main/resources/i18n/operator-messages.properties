quality.renderFailed=The page could not be rendered.
quality.title.too-long=The title is longer than 60 characters; search results will cut it off.
quality.description.missing=The page has no description. Search engines will write their own snippet from the page text.
quality.description.too-short=The description is shorter than 50 characters; 50–160 works best as a search snippet.
quality.description.too-long=The description is longer than 160 characters; search results will cut it off.
quality.h1.missing=The page has no main heading (<h1>).
quality.h1.multiple=The page has more than one main heading (<h1>). Use one; often the master puts the site name in an <h1> too.
quality.heading.skipped=Heading levels skip a level (for example <h2> followed by <h4>), which breaks the outline screen readers navigate by.
quality.img.alt-missing=An image has no alt attribute. Describe it, or use alt="" if it is purely decorative.
quality.link.empty=A link has no text a screen reader can announce (often an icon-only link). Add text or an aria-label.
quality.link.generic=A link uses generic text such as "click here" or "read more". Say where it goes instead.
quality.content.thin=The page has fewer than 150 words of content. That can be fine (a contact page); otherwise, consider saying more.
quality.title.duplicate=Another published page has the same title.
quality.description.duplicate=Another published page has the same description.

