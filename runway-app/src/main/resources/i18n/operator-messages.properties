op.pages.quality.i18nPath=URLs are not localized: every language uses the path “{0}”. In the Metadata panel, fill the “Localized path” field for each language so each URL matches its content language — important after changing the default language.
op.pages.quality.underscorePath=The URL path “{0}” uses underscores. Prefer hyphens (-): search engines read a hyphen as a word separator but an underscore as a word joiner, so “about-us” counts as two words while “about_us” counts as one.
op.pages.quality.improperCharsPath=The URL path “{0}” contains characters that don’t belong in a URL — a space or a symbol (? # % & …) has to be percent-encoded, which makes links fragile and can leave the page unreachable at the address a visitor would type. Use only lowercase letters, numbers and hyphens (-).
op.pages.quality.nonAsciiPath=The URL path “{0}” uses non-ASCII letters (é, ñ, ü, …). They work, but are percent-encoded in links — “/niños” is shared and stored as “/ni%C3%B1os”, which looks messy and can break in older tools. That is acceptable for a slug meant for readers of that language; otherwise a plain-ASCII form (“ninos”, “cafe”) is more portable and link-friendly.
op.pages.quality.uppercasePath=The URL path “{0}” has uppercase letters. URLs are case-sensitive (RFC 3986) and Runway matches them exactly, so “/About” and “/about” are different addresses — prefer all-lowercase to avoid broken links and duplicate URLs.
op.pages.quality.pathShadowsContent=The path “{0}” is also served by plugin content ({1}). A published page wins this address — that content becomes unreachable here for as long as the page keeps it.
